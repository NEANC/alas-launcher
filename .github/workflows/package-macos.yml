name: Package macOS DMG

on:
  workflow_run:
    workflows: ["Pack alas-launcher"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of "Pack alas-launcher" (leave empty for latest successful run)'
        required: false
        type: string
      version:
        description: 'Version string (leave empty for dev timestamp)'
        required: false
        type: string

jobs:
  package-dmg:
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download macOS artifact (Standard)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: package.yml
          workflow_conclusion: success
          name: AzurLaneAutoScript-macOS-latest
          run_id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Download macOS artifact (CN)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: package.yml
          workflow_conclusion: success
          name: AzurLaneAutoScript-CN-macOS-latest
          run_id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Generate DMG background image
        shell: bash
        run: |
          pip3 install Pillow
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          W, H = 640, 480
          img = Image.new("RGB", (W, H), color=(245, 245, 245))
          draw = ImageDraw.Draw(img)

          font_dir = "/System/Library/Fonts"
          try:
              font_title = ImageFont.truetype(
                  os.path.join(font_dir, "Helvetica.ttc"), 20
              )
              font_body = ImageFont.truetype(
                  os.path.join(font_dir, "Helvetica.ttc"), 15
              )
              font_cmd = ImageFont.truetype(
                  os.path.join(font_dir, "Menlo.ttc"), 13
              )
          except Exception:
              font_title = font_body = font_cmd = ImageFont.load_default()

          TEXT_COLOR = (60, 60, 60)
          CMD_COLOR = (200, 50, 50)
          HINT_COLOR = (120, 80, 80)

          lines = [
              ("\u21e9  将 AzurLaneAutoScript.app", font_title, TEXT_COLOR),
              ("      拖入 Applications 文件夹", font_title, TEXT_COLOR),
              ("", font_body, TEXT_COLOR),
              ("\u26a0\ufe0f  首次启动前，请在终端执行：", font_body, TEXT_COLOR),
              (
                  "   xattr -dr com.apple.quarantine \\",
                  font_cmd,
                  CMD_COLOR,
              ),
              (
                  "     /Applications/AzurLaneAutoScript.app",
                  font_cmd,
                  CMD_COLOR,
              ),
              ("", font_body, TEXT_COLOR),
              (
                  "   \u2776  Install: drag the app to Applications",
                  font_body,
                  TEXT_COLOR,
              ),
              (
                  "   \u2777  Before first launch: run the command above in Terminal",
                  font_body,
                  HINT_COLOR,
              ),
          ]

          y = 120
          for text, font, color in lines:
              if text:
                  bbox = draw.textbbox((0, 0), text, font=font)
                  draw.text((50, y), text, fill=color, font=font)
                  y += bbox[3] - bbox[1] + 6
              else:
                  y += 10

          img.save("background.png")
          PYEOF

      - name: Create DMG (Standard)
        shell: bash
        run: |
          VERSION="${{ github.event.workflow_run.head_branch || github.event.inputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          STANDARD_TAR=$(echo AzurLaneAutoScript-macOS-*.tar.xz)
          tar -xJf "${STANDARD_TAR}"

          npx --yes create-dmg \
            --volname "AzurLaneAutoScript" \
            --background background.png \
            --window-size 640 480 \
            --window-pos 200 120 \
            --icon-size 110 \
            --icon "AzurLaneAutoScript.app" 190 330 \
            --app-drop-link 450 330 \
            AzurLaneAutoScript.app \
            "AzurLaneAutoScript-${VERSION}-macOS.dmg"

          rm -rf AzurLaneAutoScript.app

      - name: Create DMG (CN)
        shell: bash
        run: |
          CN_TAR=$(echo AzurLaneAutoScript-CN-macOS-*.tar.xz)
          tar -xJf "${CN_TAR}"

          npx --yes create-dmg \
            --volname "AzurLaneAutoScript" \
            --background background.png \
            --window-size 640 480 \
            --window-pos 200 120 \
            --icon-size 110 \
            --icon "AzurLaneAutoScript.app" 190 330 \
            --app-drop-link 450 330 \
            AzurLaneAutoScript.app \
            "AzurLaneAutoScript-CN-${VERSION}-macOS.dmg"

          rm -rf AzurLaneAutoScript.app

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AzurLaneAutoScript-${{ env.VERSION }}-macOS-DMG
          path: |
            AzurLaneAutoScript-*-macOS.dmg

      - name: Upload to Release
        if: ${{ env.VERSION != '' && !startsWith(env.VERSION, 'dev-') }}
        shell: bash
        run: |
          gh release upload "${{ env.VERSION }}" AzurLaneAutoScript-*-macOS.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
